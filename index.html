/* ============================ MÓDULO — PENDÊNCIAS E ATIVIDADES (hub operacional) ============================ */
const pendF={quick:'todas',q:'',resp:'',cliente:'',tag:'',ativo:'',view:'lista',group:''};
const QUICKS=[['todas','Todas'],['minhas','Minhas Atividades'],['atrasadas','Atrasadas'],['hoje','Vencem Hoje'],
  ['semana','Vencem Esta Semana'],['sem-resp','Sem Responsável'],['criticas','Críticas'],
  ['aguard-cliente','Aguardando Cliente'],['aguard-interna','Aguardando Área Interna'],['concluidas','Concluídas'],
  ['orig-int','Originadas de Interações'],['orig-pend','Originadas de Pendências'],['orig-onb','Originadas do Onboarding']];
const PEND_VIEWS=[['lista','Lista'],['kanban','Kanban'],['calendario','Calendário'],['cliente','Por Cliente'],['responsavel','Por Responsável'],['exec','Visão Executiva']];
function pendDias(a){ return a.prazo? daysBetween(today().toISOString().slice(0,10),a.prazo):null; }
function pendQuickMatch(a){
  const open=!['Concluído','Cancelado'].includes(a.status); const d=pendDias(a); const me=getSession();
  switch(pendF.quick){
    case 'minhas': return !!me && a.responsavel===me.nome;
    case 'atrasadas': return open && farolAtividade(a).tone==='red';
    case 'hoje': return open && d===0;
    case 'semana': return open && d!=null && d>0 && d<=7;
    case 'sem-resp': return open && !a.responsavel;
    case 'criticas': return open && a.prioridade==='Crítica';
    case 'aguard-cliente': return a.status==='Aguardando Cliente';
    case 'aguard-interna': return a.status==='Aguardando Área Interna';
    case 'concluidas': return a.status==='Concluído';
    case 'orig-int': return ['Evento Pontual','Histórico Diário da Conversa','Interação do Cliente'].includes(a.origem);
    case 'orig-pend': return a.origem==='Pendência Operacional';
    case 'orig-onb': return a.origem==='Onboarding';
    default: return true;
  }
}
function pendTextMatch(a){
  if(pendF.resp && a.responsavel!==pendF.resp) return false;
  if(pendF.cliente && a.cliente!==pendF.cliente) return false;
  if(pendF.ativo && a.ativoId!==pendF.ativo) return false;
  if(pendF.tag && !(a.tags||[]).includes(pendF.tag)) return false;
  if(pendF.q){ const q=pendF.q.toLowerCase();
    const hay=[a.titulo,a.descricao,a.responsavel,nomeCliente(a.cliente),ativoNome(a.cliente,a.ativoId),(a.tags||[]).join(' '),a.origem,a.status].join(' ').toLowerCase();
    if(!hay.includes(q)) return false; }
  return true;
}
function pendList(){ return DB().activities.filter(a=>pendQuickMatch(a)&&pendTextMatch(a)); }
function priorDot(p){ return `<span class="prio-dot" title="${esc(p)}" style="background:${PRIOR_COLOR[p]||'#999'}"></span>`; }
function pendRow(a){
  const f=farolAtividade(a); const done=a.status==='Concluído';
  return `<tr ${can('editActivity')?`onclick="App.editAtividade('${a.id}')" style="cursor:pointer"`:''}>
    <td onclick="event.stopPropagation()">${can('editActivity')?`<input type="checkbox" class="qcheck" ${done?'checked':''} title="Concluir" onclick="App.concluirAtividade('${a.id}',this.checked)">`:''}</td>
    <td><span class="fdot" style="background:${toneVar(f.tone)}" title="${esc(f.label)}"></span></td>
    <td>${priorDot(a.prioridade)}<b style="${done?'text-decoration:line-through;opacity:.6':''}">${esc(a.titulo)}</b>
      ${(a.tags||[]).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</td>
    <td>${esc(nomeCliente(a.cliente))}${a.ativoId&&ativoNome(a.cliente,a.ativoId)?`<br><span class="rel-asset">${svg(I.map,1.6)} ${esc(ativoNome(a.cliente,a.ativoId))}</span>`:''}</td><td>${esc(a.responsavel||'—')}</td>
    <td>${a.origem?badge(a.origem,ORIGEM_TONE[a.origem]||'slate'):'—'}</td>
    <td class="num">${fmtD(a.prazo)}</td><td>${badge(a.status,ATIV_STATUS_TONE[a.status])}</td>
  </tr>`;
}
function pendTable(list){
  return `<div class="tbl-wrap"><table class="data pend-table"><thead><tr>
    <th></th><th>Farol</th><th>Atividade</th><th>Cliente</th><th>Responsável</th><th>Origem</th><th>Prazo</th><th>Status</th>
  </tr></thead><tbody>${list.length? list.map(pendRow).join('') : emptyRow(8,'Nenhuma atividade para este filtro.')}</tbody></table></div>`;
}
function pendOrdena(list){ const ord={red:0,amber:1,green:2,slate:3};
  return list.slice().sort((a,b)=>(ord[farolAtividade(a).tone]-ord[farolAtividade(b).tone])||String(a.prazo||'~').localeCompare(String(b.prazo||'~'))); }
function pendGrouped(list,keyFn){
  const groups={}; list.forEach(a=>{const k=keyFn(a)||'—';(groups[k]=groups[k]||[]).push(a);});
  const keys=Object.keys(groups).sort((x,y)=>groups[y].length-groups[x].length);
  return keys.map(k=>`<div class="card" style="margin-bottom:14px"><div class="card-head"><h3>${esc(k)}</h3>
    <div class="spacer"></div><span class="pill">${groups[k].length}</span></div>
    <div class="card-body" style="padding-top:0">${pendTable(pendOrdena(groups[k]))}</div></div>`).join('');
}
function pendCalendar(list){
  const base=today(); const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1), start=(first.getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
  const byDay={}; list.forEach(a=>{ if(!a.prazo) return; const d=parseD(a.prazo); if(d&&d.getFullYear()===y&&d.getMonth()===m){ (byDay[d.getDate()]=byDay[d.getDate()]||[]).push(a); } });
  const sem=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let cells=''; for(let i=0;i<start;i++) cells+='<div class="cal-cell cal-empty"></div>';
  const todayD=(base.getDate());
  for(let day=1;day<=dim;day++){ const items=byDay[day]||[];
    cells+=`<div class="cal-cell ${day===todayD?'cal-today':''}"><div class="cal-day">${day}</div>
      ${items.slice(0,4).map(a=>{const f=farolAtividade(a);
        return `<div class="cal-ev" style="border-left-color:${toneVar(f.tone)}" onclick="App.editAtividade('${a.id}')" title="${esc(a.titulo)}">${esc(a.titulo)}</div>`;}).join('')}
      ${items.length>4?`<div class="cal-more">+${items.length-4}</div>`:''}</div>`; }
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return `<div class="card"><div class="card-head"><div class="ico">${svg(I.cal)}</div><h3>${meses[m]} de ${y}</h3>
    <div class="spacer"></div><span class="desc">atividades com prazo no mês corrente</span></div>
    <div class="card-body"><div class="cal-grid">${sem.map(s=>`<div class="cal-head-cell">${s}</div>`).join('')}${cells}</div></div></div>`;
}
function pendExec(){
  const acts=DB().activities; const open=acts.filter(a=>!['Concluído','Cancelado'].includes(a.status));
  const cnt=(arr,fn)=>{const m={};arr.forEach(a=>{const k=fn(a)||'—';m[k]=(m[k]||0)+1;});return m;};
  const topCli=Object.entries(cnt(open,a=>nomeCliente(a.cliente))).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const topResp=Object.entries(cnt(open,a=>a.responsavel)).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const tbl=(t,ents)=>`<div class="card"><div class="card-head"><h3>${t}</h3></div><div class="card-body">${
    ents.length? ents.map(([k,v])=>{const max=ents[0][1];return `<div class="dist-row"><span class="dist-lbl">${esc(k)}</span><div class="dist-bar"><i style="width:${Math.round(v/max*100)}%"></i></div><b>${v}</b></div>`;}).join('') : '<p style="color:var(--txt-3)">Sem dados.</p>'}</div></div>`;
  return `<div class="cfg-grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
    ${tbl('Top 10 Clientes com mais Pendências',topCli)}
    ${tbl('Top Responsáveis por Atividades',topResp)}
    <div class="card"><div class="card-head"><h3>Atividades por Status</h3></div><div class="card-body">${distList(cnt(acts,a=>a.status))}</div></div>
    <div class="card"><div class="card-head"><h3>Atividades por Origem</h3></div><div class="card-body">${distList(cnt(acts,a=>a.origem||'Manual'))}</div></div>
    <div class="card"><div class="card-head"><h3>Atividades por Tag</h3></div><div class="card-body">${(()=>{const m={};acts.forEach(a=>(a.tags||[]).forEach(t=>m[t]=(m[t]||0)+1));return Object.keys(m).length?distList(m):'<p style="color:var(--txt-3)">Sem tags.</p>';})()}</div></div>
  </div>`;
}
function renderPendencias(){
  const acts=DB().activities; const open=acts.filter(a=>!['Concluído','Cancelado'].includes(a.status));
  const nAtraso=open.filter(a=>farolAtividade(a).tone==='red').length;
  const nCrit=open.filter(a=>a.prioridade==='Crítica').length;
  const nHoje=open.filter(a=>pendDias(a)===0).length;
  const nSemResp=open.filter(a=>!a.responsavel).length;
  const cs=DB().clientes;
  const o=(v,t,s)=>`<option value="${esc(v)}" ${v===s?'selected':''}>${esc(t)}</option>`;
  const card=(cls,lbl,val,q,foot)=>`<div class="kpi kpi-nav ${cls}${pendF.quick===q?' kpi-on':''}" onclick="App.pendQuick('${q}')" title="${esc(String(lbl)+(foot?' — '+String(foot):'')+' · clique para filtrar')}"><div class="top"><span class="kpi-ico">${svg(kpiIcon(lbl))}</span><span class="lbl">${lbl}</span><span class="kpi-go">${svg(I.filter,1.8)}</span></div><div class="val">${val}</div><div class="foot">${foot}</div></div>`;
  const list=pendOrdena(pendList());
  let viewHTML='';
  if(pendF.view==='kanban') viewHTML=`<div class="card"><div class="card-body">${kanbanAtividades('',pendList())}</div></div>`;
  else if(pendF.view==='calendario') viewHTML=pendCalendar(pendList());
  else if(pendF.view==='cliente') viewHTML=pendGrouped(pendList(),a=>nomeCliente(a.cliente))||'<p style="color:var(--txt-3)">Nada.</p>';
  else if(pendF.view==='responsavel') viewHTML=pendGrouped(pendList(),a=>a.responsavel)||'<p style="color:var(--txt-3)">Nada.</p>';
  else if(pendF.view==='exec') viewHTML=pendExec();
  else { // lista (com agrupamento opcional)
    if(pendF.group){ const keyFn={status:a=>a.status,prioridade:a=>a.prioridade,tag:a=>(a.tags||[])[0],origem:a=>a.origem||'Manual',cliente:a=>nomeCliente(a.cliente),responsavel:a=>a.responsavel}[pendF.group];
      viewHTML=pendGrouped(list,keyFn); }
    else viewHTML=`<div class="card"><div class="card-body" style="padding-top:6px">${pendTable(list)}</div></div>`;
  }
  el('view-pendencias').innerHTML=`
  <div class="kpi-grid">
    ${card('k-blue','Em Aberto',open.length,'abertas','total não concluído')}
    ${card('k-red','Atrasadas',nAtraso,'atrasadas','prazo vencido')}
    ${card('k-amber','Críticas',nCrit,'criticas','prioridade máxima')}
    ${card('k-teal','Vencem Hoje',nHoje,'hoje','ação imediata')}
    ${card('k-purple','Sem Responsável',nSemResp,'sem-resp','aguardando atribuição')}
  </div>
  <div class="chips">${QUICKS.map(([k,l])=>`<button class="chip-btn ${pendF.quick===k?'active':''}" onclick="App.pendQuick('${k}')">${l}</button>`).join('')}</div>
  <div class="filters" style="margin:12px 0">
    <span class="fl-label">${svg(I.filter,2)} Filtrar</span>
    <input type="search" placeholder="Buscar cliente, responsável, palavra-chave…" value="${esc(pendF.q)}" oninput="App.pendSearch(this.value)" style="min-width:230px">
    <select onchange="App.pendSet('resp',this.value)"><option value="">Responsável</option>${[...ANALISTAS,...KEY_ACCOUNTS].map(r=>o(r,r,pendF.resp)).join('')}</select>
    <select onchange="App.pendSet('cliente',this.value)"><option value="">Cliente</option>${cs.map(c=>o(c.id,c.nome.split(' ').slice(0,2).join(' '),pendF.cliente)).join('')}</select>
    <select onchange="App.pendSet('tag',this.value)"><option value="">Tag</option>${ATIV_TAGS.map(t=>o(t,t,pendF.tag)).join('')}</select>
    ${pendF.cliente&&ativosDoCliente(pendF.cliente).length?`<select onchange="App.pendSet('ativo',this.value)"><option value="">Ativo</option>${ativosDoCliente(pendF.cliente).map(a=>o(a.id,a.nome||a.id,pendF.ativo)).join('')}</select>`:''}
    ${pendF.view==='lista'?`<select onchange="App.pendSet('group',this.value)"><option value="">Agrupar por…</option>${[['cliente','Cliente'],['responsavel','Responsável'],['status','Status'],['prioridade','Prioridade'],['tag','Tag'],['origem','Origem']].map(g=>o(g[0],g[1],pendF.group)).join('')}</select>`:''}
    <button class="btn ghost sm" onclick="App.pendClear()">Limpar</button>
    <div class="spacer"></div>
    ${gate('createActivity',`<button class="btn primary sm" onclick="App.novaAtividade('')">${svg(I.plus)} Nova atividade</button>`)}
  </div>
  <div class="view-switch">${PEND_VIEWS.map(([k,l])=>`<button class="vsw ${pendF.view===k?'active':''}" onclick="App.pendView('${k}')">${l}</button>`).join('')}
    <span class="pill" style="margin-left:auto">${list.length} resultado(s)</span></div>
  ${viewHTML}`;
}
function distList(map){
  const ents=Object.entries(map).sort((a,b)=>b[1]-a[1]); if(!ents.length) return '<p style="color:var(--txt-3)">Nada aberto.</p>';
  const max=Math.max(...ents.map(e=>e[1]));
  return ents.map(([k,v])=>`<div class="dist-row"><span class="dist-lbl">${esc(k)}</span>
    <div class="dist-bar"><i style="width:${Math.round(v/max*100)}%"></i></div><b>${v}</b></div>`).join('');
}

/* ============================ MÓDULO — INTERAÇÕES (WhatsApp/CRM) ============================ */
const intF={cliente:'',resp:'',kind:'',tipo:'',status:'',tag:'',canal:'',data:'',ativo:''};
function renderInteracoes(){
  let list=DB().interactions.slice().sort((a,b)=>(b.data+(b.hora||'')).localeCompare(a.data+(a.hora||'')));
  if(intF.cliente) list=list.filter(i=>i.cliente===intF.cliente);
  if(intF.resp) list=list.filter(i=>i.responsavel===intF.resp);
  if(intF.kind) list=list.filter(i=>(i.kind||'evento')===intF.kind);
  if(intF.tipo) list=list.filter(i=>i.tipo===intF.tipo);
  if(intF.status) list=list.filter(i=>i.status===intF.status);
  if(intF.tag) list=list.filter(i=>(i.tags||[]).includes(intF.tag));
  if(intF.canal) list=list.filter(i=>(i.canal||'WhatsApp')===intF.canal);
  if(intF.data) list=list.filter(i=>i.data===intF.data);
  if(intF.ativo) list=list.filter(i=>i.ativoId===intF.ativo);
  const cs=DB().clientes;
  const o=(v,t,s)=>`<option value="${esc(v)}" ${v===s?'selected':''}>${esc(t)}</option>`;
  const nEvt=DB().interactions.filter(i=>(i.kind||'evento')==='evento').length;
  const nDia=DB().interactions.filter(i=>i.kind==='diario').length;
  el('view-interacoes').innerHTML=`
  <div class="section-bar"><h2>Interações do Cliente</h2><div class="line"></div>
    <span class="pill">${nEvt} evento(s) · ${nDia} histórico(s) diário(s)</span>
    ${gate('whatsAdd',`<button class="btn sm" onclick="App.novaInteracao('','evento')">${svg(I.chat)} Novo evento pontual</button>
      <button class="btn primary sm" onclick="App.novaInteracao('','diario')">${svg(I.doc)} Novo histórico diário</button>`)}</div>
  <div class="filters" style="margin-bottom:14px">
    <span class="fl-label">${svg(I.filter,2)} Filtros</span>
    <select onchange="App.intFilter('cliente',this.value)"><option value="">Cliente</option>${cs.map(c=>o(c.id,c.nome.split(' ').slice(0,2).join(' '),intF.cliente)).join('')}</select>
    <select onchange="App.intFilter('kind',this.value)"><option value="">Tipo de registro</option>${INT_KINDS.map(k=>o(k[0],k[1],intF.kind)).join('')}</select>
    <select onchange="App.intFilter('resp',this.value)"><option value="">Responsável</option>${[...ANALISTAS,...KEY_ACCOUNTS].map(r=>o(r,r,intF.resp)).join('')}</select>
    <select onchange="App.intFilter('tipo',this.value)"><option value="">Tipo de evento</option>${INT_TIPOS.map(t=>o(t,t,intF.tipo)).join('')}</select>
    <select onchange="App.intFilter('status',this.value)"><option value="">Status</option>${INT_STATUS.map(t=>o(t,t,intF.status)).join('')}</select>
    <select onchange="App.intFilter('tag',this.value)"><option value="">Tag</option>${INT_TAGS.map(t=>o(t,t,intF.tag)).join('')}</select>
    <select onchange="App.intFilter('canal',this.value)"><option value="">Canal</option>${INT_CANAIS.map(t=>o(t,t,intF.canal)).join('')}</select>
    <input type="date" value="${intF.data}" onchange="App.intFilter('data',this.value)" title="Data">
    ${intF.cliente&&ativosDoCliente(intF.cliente).length?`<select onchange="App.intFilter('ativo',this.value)"><option value="">Ativo</option>${ativosDoCliente(intF.cliente).map(a=>o(a.id,a.nome||a.id,intF.ativo)).join('')}</select>`:''}
    <button class="btn ghost sm" onclick="App.intFilterClear()">Limpar</button>
  </div>
  ${list.length? `<div class="card"><div class="card-body">${intTimeline(list,true)}</div></div>`
    : '<div class="card"><div class="card-body"><p style="color:var(--txt-3);text-align:center;padding:24px">Nenhuma interação corresponde aos filtros.</p></div></div>'}`;
}
function whatsTimeline(cid){
  const all=DB().interactions.filter(i=>i.cliente===cid).sort((a,b)=>(b.data+(b.hora||'')).localeCompare(a.data+(a.hora||'')));
  const evt=all.filter(i=>(i.kind||'evento')==='evento'); const dia=all.filter(i=>i.kind==='diario');
  return `<div class="card" data-id="jornada.card.eventos-pontuais"><div class="card-head"><div class="ico">${svg(I.chat)}</div><h3 data-id="jornada.texto.titulo-eventos-pontuais">Eventos Pontuais</h3>
    <div class="spacer"></div>${gate('whatsAdd',`<button class="btn ghost sm" data-id="jornada.botao.novo-evento" onclick="App.novaInteracao('${cid}','evento')">${svg(I.plus)} Novo evento</button>`)}</div>
    <div class="card-body">${evt.length?intTimeline(evt,false):'<p style="color:var(--txt-3)">Nenhum evento pontual registrado.</p>'}</div></div>
  <div class="card" style="margin-top:16px" data-id="jornada.card.historicos-diarios"><div class="card-head"><div class="ico">${svg(I.doc)}</div><h3 data-id="jornada.texto.titulo-historicos-diarios">Históricos Diários da Conversa</h3>
    <div class="spacer"></div>${gate('whatsAdd',`<button class="btn ghost sm" data-id="jornada.botao.novo-historico-diario" onclick="App.novaInteracao('${cid}','diario')">${svg(I.plus)} Novo histórico</button>`)}</div>
    <div class="card-body">${dia.length?intTimeline(dia,false):'<p style="color:var(--txt-3)">Nenhum histórico diário registrado.</p>'}</div></div>`;
}
let _intAnexos=[];
let _cliAtivos=[];   // ativos em edição no modal de cliente (legado — usado só pelo modal antigo)
let _cadAtivos=[];   // ativos em edição na página dedicada de Ativos do Cadastro
function canAtivos(){ const u=getSession(); return !!u && (u.perfil==='Gestão Executiva'||u.perfil==='Onboarding'||u.perfil==='Middle'||u.perfil==='Desenvolvedor'); }
function anxSize(n){ n=+n||0; return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'; }
function intAnexoRender(){ const box=el('in_anexos_list'); if(!box) return;
  box.innerHTML = _intAnexos.length
    ? _intAnexos.map(a=>`<div class="anx-row"><span class="anx-nm">${svg(I.doc)} ${esc(a.nome)}</span>
        <span class="anx-sz">${anxSize(a.size)}</span>
        <a class="btn ghost sm" href="${a.data}" download="${esc(a.nome)}" title="Baixar">${svg(I.download)}</a>
        <button type="button" class="btn ghost sm" onclick="App.intAnexoDel('${a.id}')" title="Remover">${svg(I.trash)}</button></div>`).join('')
    : '<p style="font-size:12px;color:var(--txt-3);margin:0 0 6px">Nenhum anexo. O arquivo é incorporado ao registro (armazenamento local).</p>';
}
function intDiarioBlocos(i){
  const blk=(lbl,val,tone)=> (val&&String(val).trim())? `<div class="int-blk"><span class="int-blk-lbl" style="color:${toneVar(tone)}">${lbl}</span><div>${esc(val)}</div></div>`:'';
  const out=blk('Pontos de atenção',i.pontosAtencao,'amber')+blk('Decisões acordadas',i.decisoes,'green')+blk('Pendências identificadas',i.pendencias,'red');
  return out?`<div class="int-blocos">${out}</div>`:'';
}
function intTimeline(list,showCli){
  return `<div class="int-timeline">${list.map(i=>{
    const linked = i.atividadeId && DB().activities.find(a=>a.id===i.atividadeId);
    const isDia=(i.kind==='diario');
    const kindBadge = isDia ? badge('Histórico Diário','blue','interacao.selo.tipo-registro') : badge('Evento Pontual','violet','interacao.selo.tipo-registro');
    return `<div class="int-item ${isDia?'int-diario':''}" data-id="interacao.lista.item">
    <div class="int-meta" data-id="interacao.texto.meta"><b>${fmtD(i.data)} ${esc(i.hora||'')}</b> · ${esc(i.responsavel||'—')} · ${esc(i.canal||'WhatsApp')}
      ${showCli?'· '+esc(nomeCliente(i.cliente)):''}</div>
    <div class="int-badges">${kindBadge}${(i.tipo&&!isDia)?badge(i.tipo,'slate'):''}${i.status?badge(i.status,INT_STATUS_TONE[i.status]||'slate'):''}
      ${i.ativoId&&ativoNome(i.cliente,i.ativoId)?`<span class="badge b-violet"><span class="d"></span>${esc(ativoNome(i.cliente,i.ativoId))}</span>`:''}
      ${(i.tags||[]).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</div>
    <div class="int-resumo" data-id="interacao.texto.resumo">${esc(i.resumo||'')}</div>
    ${isDia?intDiarioBlocos(i):''}
    ${i.texto?`<details class="int-full"><summary>${isDia?'Ver conversa integral do dia':'Ver conversa completa'}</summary><pre>${esc(i.texto)}</pre></details>`:''}
    ${i.proximaAcao?`<div class="int-next">→ Próxima ação: <b>${esc(i.proximaAcao)}</b>${i.prazoAcao?' · prazo '+fmtD(i.prazoAcao):''}</div>`:''}
    ${(i.anexos&&i.anexos.length)?`<div class="anx-list">${i.anexos.map(x=>`<a class="anx-chip" href="${x.data}" download="${esc(x.nome)}" title="${esc(x.path||x.nome)}">${svg(I.doc)} ${esc(x.nome)} <span class="anx-sz">${anxSize(x.size)}</span></a>`).join('')}</div>`:''}
    ${ linked
      ? `<div class="link-ref"><span class="link-ref-lbl">${svg(I.clock)} Atividade vinculada</span>
          <div class="link-ref-body">${esc(linked.titulo)} · ${esc(linked.status)}</div>
          <button class="btn ghost sm" onclick="App.irParaAtividade('${linked.id}')">Ver atividade</button></div>`
      : gate('createActivity',`<div class="int-actions"><button class="btn sm" onclick="App.interacaoViraAtividade('${i.id}')">${svg(I.plus)} Gerar atividade vinculada</button></div>`) }
    <div class="int-actions">
      ${(can('whatsEditAny')||can('whatsAdd'))?`<button class="btn ghost sm" data-id="interacao.botao.editar" onclick="App.editInteracao('${i.id}')">${svg(I.edit)} Editar</button>`:''}
      ${can('whatsDelete')?`<button class="btn ghost sm" data-id="interacao.botao.excluir" onclick="App.delInteracao('${i.id}')">${svg(I.trash)}</button>`:''}
    </div>
  </div>`;}).join('')}</div>`;
}

function renderHistorico(){
  const h=DB().history;
  el('view-historico').innerHTML=`
  <div class="section-bar"><h2>Histórico de Alterações</h2><div class="line"></div>
    <span class="pill">${h.length} registro(s)</span>

function histTable(list,canDel){
  if(!list.length) return '<p style="color:var(--txt-3)">Nenhuma alteração registrada.</p>';
  return `<div class="tbl-wrap" data-id="alteracao.tabela.principal"><table class="data"><thead><tr>
    <th>Data</th><th>Hora</th><th>Usuário</th><th>Módulo</th><th>Cliente</th><th>Campo</th><th>De</th><th>Para</th>${canDel?'<th></th>':''}
  </tr></thead><tbody>${list.map(x=>`<tr data-id="alteracao.tabela.linha">
    <td class="num">${esc(x.data)}</td><td class="num">${esc(x.hora)}</td><td>${esc(x.usuario)}</td><td>${esc(x.modulo||'—')}</td>
    <td>${esc(x.cliente||'—')}</td><td>${esc(x.campo||'—')}</td><td>${esc(x.de||'—')}</td><td><b>${esc(x.para||'—')}</b></td>
    ${canDel?`<td><button class="btn ghost sm" onclick="App.delHistorico('${x.id}')">${svg(I.trash)}</button></td>`:''}
  </tr>`).join('')}</tbody></table></div>`;
}

function renderAuditoria(){
  const d=DB(); const byUser={};
  d.users.forEach(u=>byUser[u.nome]={perfil:u.perfil,email:u.email,login:null,alt:0,cli:0});
  d.logins.forEach(l=>{ if(byUser[l.usuario]&&!byUser[l.usuario].login) byUser[l.usuario].login=l.data+' '+l.hora; });
  d.history.forEach(x=>{ if(byUser[x.usuario]){ byUser[x.usuario].alt++; if(x.campo==='Cliente'&&x.para==='Cadastrado') byUser[x.usuario].cli++; } });
  el('view-auditoria').innerHTML=`
  <div class="section-bar"><h2>Auditoria</h2><div class="line"></div><span class="pill">rastreabilidade por usuário</span></div>
  <div class="card"><div class="card-head"><div class="ico">${svg(I.eye)}</div><h3>Atividade por Usuário</h3></div>
    <div class="tbl-wrap"><table class="data"><thead><tr>
      <th>Usuário</th><th>Perfil</th><th>Último Acesso</th><th>Alterações</th><th>Clientes Cadastrados</th>
    </tr></thead><tbody>${Object.entries(byUser).map(([n,v])=>`<tr>
      <td>${esc(n)}</td><td>${badge(v.perfil,perfilTone(v.perfil))}</td><td class="num">${v.login||'—'}</td>
      <td class="num">${v.alt}</td><td class="num">${v.cli}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card" style="margin-top:16px"><div class="card-head"><div class="ico">${svg(I.history)}</div><h3>Log de Acessos</h3></div>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>Data</th><th>Hora</th><th>Usuário</th><th>E-mail</th><th>Perfil</th></tr></thead>
    <tbody>${d.logins.length? d.logins.slice(0,80).map(l=>`<tr><td class="num">${esc(l.data)}</td><td class="num">${esc(l.hora)}</td>
      <td>${esc(l.usuario)}</td><td>${esc(l.email)}</td><td>${badge(l.perfil,perfilTone(l.perfil))}</td></tr>`).join('')
      : '<tr><td colspan="5" style="color:var(--txt-3)">Nenhum acesso registrado.</td></tr>'}</tbody></table></div></div>`;
}
function perfilTone(p){ return {'Gestão Executiva':'violet','Onboarding':'blue','Key Account':'amber','Área Parceira':'slate'}[p]||'slate'; }

function relatorioHTML(){
  const d=DB(); const np=nowParts(); const u=getSession(); const cfg=d.config;
  const cs=d.clientes; const acts=d.activities;
  const scored=cs.map(c=>calcHealth(c.id)).filter(Boolean);
  const hsMed=scored.length?Math.round(scored.reduce((s,h)=>s+h.total,0)/scored.length):0;
  const dist={green:scored.filter(h=>h.tone==='green').length,amber:scored.filter(h=>h.tone==='amber').length,red:scored.filter(h=>h.tone==='red').length};
  const open=acts.filter(a=>!['Concluído','Cancelado'].includes(a.status));
  const atras=open.filter(a=>farolAtividade(a).tone==='red').length;
  const esc2=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const linhaCli=cs.map(c=>{ const h=calcHealth(c.id);
    return `<tr><td>${esc2(c.nome)}</td><td>${esc2((c.cidade?c.cidade+'/':'')+(c.estado||'—'))}</td><td>${esc2(etapaInfo(c.etapa).label||c.etapa||'')}</td>
      <td style="text-align:center">${h?h.total:'—'}</td><td>${h?h.cls:'—'}</td>
      <td style="text-align:center">${ativosTotalCliente(c)}</td><td>${esc2(c.respOnboarding||'—')}</td></tr>`;}).join('');
  const ag=ativosAgrega();
  const geo=(m)=>{ const ents=Object.entries(m).sort((a,b)=>b[1]-a[1]); const max=ents.length?ents[0][1]:1;
    return ents.length? ents.map(([k,v])=>`<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;margin:3px 0"><span style="width:130px">${esc2(k)}</span><span style="flex:1;height:10px;background:#ECEFF4;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(v/max*100)}%;background:#2E6BE6"></i></span><b>${v}</b></div>`).join('') : '<span style="color:#888">Sem ativos.</span>'; };
  const topAtr=open.filter(a=>farolAtividade(a).tone==='red')
    .sort((a,b)=>String(a.prazo||'~').localeCompare(String(b.prazo||'~'))).slice(0,12)
    .map(a=>`<tr><td>${esc2(a.titulo)}</td><td>${esc2(nomeCliente(a.cliente))}</td><td>${esc2(a.responsavel||'—')}</td><td>${esc2(a.prioridade)}</td><td>${esc2(a.prazo||'—')}</td></tr>`).join('')
    || '<tr><td colspan="5" style="color:#888">Nenhuma atividade atrasada.</td></tr>';
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>OnboardOps · Relatório Executivo</title>
  <style>
    *{box-sizing:border-box} body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#0F1B2D;margin:0;padding:40px;background:#fff}
    h1{font-size:22px;margin:0 0 2px} .sub{color:#5B6B82;font-size:13px;margin-bottom:2px}
    .meta{color:#8A94A6;font-size:11.5px;margin-bottom:22px}
    .kpis{display:flex;gap:14px;margin:18px 0 26px;flex-wrap:wrap}
    .k{flex:1;min-width:120px;border:1px solid #E4E9F0;border-radius:12px;padding:14px 16px}
    .k .v{font-size:26px;font-weight:700} .k .l{font-size:11px;color:#5B6B82;text-transform:uppercase;letter-spacing:.04em}
    h2{font-size:14px;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid #0F1B2D}
    table{width:100%;border-collapse:collapse;font-size:11.5px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #ECEFF4}
    th{color:#5B6B82;text-transform:uppercase;font-size:10px;letter-spacing:.04em}
    .g{color:#1F9254}.a{color:#BB7A00}.r{color:#CE2C31}
    @media print{body{padding:16px}.noprint{display:none}}
    .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 2px;border:1px solid #E4E9F0}
    .bar i{display:block;height:100%}
  </style></head><body>
  <h1>${esc2(cfg.empresa||'Trinus')} · Relatório Executivo</h1>
  <div class="sub">${esc2(cfg.tagline||'Portal de Customer Success & Jornada do Cliente')}</div>
  <div class="meta">Gerado em ${esc2(np.data)} ${esc2(np.hora)}${u?' · por '+esc2(u.nome)+' ('+esc2(u.perfil)+')':''}</div>
  <div class="kpis">
    <div class="k"><div class="v">${cs.length}</div><div class="l">Clientes</div></div>

// Filtros exclusivos do Mapa (geografia) — cliente/produto/tipologia/Key Account/Onboarding
// agora vêm do filtro global do cabeçalho (mesmo filtro do Executivo e do Pipeline).
const mapaF={estadoCliente:'',estadoAtivo:'',regiao:''};
// Competência mensal — filtro global de período + seletores de fechamento/anual
const PERIODO={mode:'all',mes:(new Date()).getMonth(),ano:(new Date()).getFullYear(),de:'',ate:''};
const FECH={mes:(new Date()).getMonth(),ano:(new Date()).getFullYear()};
let ANUAL=(new Date()).getFullYear();
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_ABREV=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function anosDisponiveis(){ const ys=new Set([PERIODO.ano,FECH.ano,ANUAL,(new Date()).getFullYear()]);
  (DB().propostas||[]).forEach(p=>{[p.dataElaboracao,p.dataAprovacao,p.dataAssinatura,p.dataPerdida].forEach(d=>{if(d)ys.add(+String(d).slice(0,4));});});
  (DB().clientes||[]).forEach(c=>{if(c.criadoEm)ys.add(+String(c.criadoEm).slice(0,4)); if(c.dataAssinatura)ys.add(+String(c.dataAssinatura).slice(0,4));});
  return [...ys].filter(Boolean).sort((a,b)=>b-a); }
function periodoLabel(p){ if(!p||p.mode==='all') return 'Todos os períodos';
  if(p.mode==='mes') return MESES[p.mes]+' / '+p.ano; if(p.mode==='ano') return 'Ano '+p.ano;
  if(p.mode==='custom') return (p.de||'…')+' a '+(p.ate||'…'); return 'Todos os períodos'; }
function periodoBar(){
  const anos=anosDisponiveis(); const m=PERIODO.mode;
  const opt=(v,l,sel)=>`<option value="${v}" ${String(sel)===String(v)?'selected':''}>${l}</option>`;
  return `<div class="periodo-bar no-print">
    <span class="pb-ico">${svg(I.clock)}</span><span class="pb-tit">Competência</span>
    <select onchange="App.periodoMode(this.value)">

    </select>
    ${m==='mes'?`<select onchange="App.periodoSet('mes',this.value)">${MESES.map((mm,i)=>opt(i,mm,PERIODO.mes)).join('')}</select>
       <select onchange="App.periodoSet('ano',this.value)">${anos.map(y=>opt(y,y,PERIODO.ano)).join('')}</select>`:''}
    ${m==='ano'?`<select onchange="App.periodoSet('ano',this.value)">${anos.map(y=>opt(y,y,PERIODO.ano)).join('')}</select>`:''}
    ${m==='custom'?`<input type="date" value="${PERIODO.de||''}" onchange="App.periodoSet('de',this.value)">
       <span style="color:var(--txt-3)">até</span><input type="date" value="${PERIODO.ate||''}" onchange="App.periodoSet('ate',this.value)">`:''}
    <span class="pb-tag">${esc(periodoLabel(PERIODO))}</span>

}
function geoBars(map,toneFn,valFmt,labelFn){
  const ents=Object.entries(map).sort((a,b)=>b[1]-a[1]); if(!ents.length) return '<p style="color:var(--txt-3);font-size:13px">Sem dados para os filtros atuais.</p>';
  const max=ents[0][1]||1; const fmt=valFmt||(v=>num(v)); const lab=labelFn||(k=>k);
  return `<div class="geo-bars">${ents.map(([k,v])=>{const tone=toneFn?toneFn(k):'blue';
    return `<div class="geo-row"><span class="geo-lbl" title="${esc(String(k))}">${esc(String(lab(k)))}</span><div class="geo-track"><i style="width:${Math.round(v/max*100)}%;background:${toneVar(tone)}"></i></div><span class="geo-val">${fmt(v)}</span></div>`;}).join('')}</div>`;
}

// V6 · Inteligência territorial: ranking e leituras a partir das agregações existentes
function biRank(titulo,mapa,fmt,labelFn){
  const ents=Object.entries(mapa).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const tot=Object.values(mapa).reduce((a,b)=>a+b,0)||1;
  const f=fmt||(v=>num(v)); const lab=labelFn||(k=>k);
  if(!ents.length) return `<div class="card"><div class="card-head"><h3>${esc(titulo)}</h3></div><div class="card-body"><p style="color:var(--txt-3);font-size:13px">Sem dados para os filtros atuais.</p></div></div>`;
  return `<div class="card"><div class="card-head"><div class="ico">${svg(I.trend)}</div><h3>${esc(titulo)}</h3>
      <div class="spacer"></div><span class="pill">top ${ents.length}</span></div>
    <div class="card-body"><div class="bi-rank">
      ${ents.map(([k,v],i)=>`<div class="bi-row" title="${esc(String(lab(k)))} · ${esc(String(f(v)))} · ${pct(v,tot)}% do total">
        <span class="bi-pos">${i+1}</span>
        <span class="bi-nm">${esc(String(lab(k)))}<small>${pct(v,tot)}% do total</small></span>
        <span class="bi-share"><i style="width:${Math.round(v/ents[0][1]*100)}%"></i></span>
        <span class="bi-val">${f(v)}</span></div>`).join('')}
    </div></div></div>`;
}
function mapaBISec(ag){
  if(!ag || !ag.total) return '';
  const vgvTot=ag.vgvTotal||1;
  const ufsV=Object.entries(ag.vgvPorEstado).sort((a,b)=>b[1]-a[1]);
  const regsV=Object.entries(ag.vgvPorRegiao).sort((a,b)=>b[1]-a[1]);
  const topUf=ufsV[0], topReg=regsV[0];
  const concUf=topUf?pct(topUf[1],vgvTot):0;
  const depReg=topReg?pct(topReg[1],vgvTot):0;
  const top3=ufsV.slice(0,3).reduce((a,b)=>a+b[1],0);
  const conc3=pct(top3,vgvTot);
  const nUf=Object.keys(ag.porEstado).length, nReg=Object.keys(ag.porRegiao).length;
  const vgvUnid=ag.unidadesTotal?Math.round(ag.vgvTotal/ag.unidadesTotal):0;
  const vgvAtivo=ag.numAtivos?Math.round(ag.vgvTotal/ag.numAtivos):0;
  const booked=comercialFunil().valorAssinado;
  const cobertura=pct(nUf,UFS.length);

  // leitura de risco de concentração
  const tomConc = concUf>=60?'red':(concUf>=40?'amber':'green');
  const txtConc = concUf>=60?'concentração alta':(concUf>=40?'concentração moderada':'carteira distribuída');

  // matriz de correlação por região (dados já agregados)
  const regioes=Array.from(new Set([...Object.keys(ag.porRegiao),...Object.keys(ag.cliPorRegiao)]));
  const linhas=regioes.map(r=>({r,
    cli:ag.cliPorRegiao[r]||0, at:ag.porRegiao[r]||0,
    un:ag.unidPorRegiao[r]||0, vgv:ag.vgvPorRegiao[r]||0}))
    .sort((a,b)=>b.vgv-a.vgv);

  const ins=[];
  ins.push([I.target,'Concentração territorial',
    `${UF_NOME[topUf[0]]||topUf[0]} concentra ${concUf}% do VGV e os três maiores estados somam ${conc3}% — ${txtConc}.`]);
  ins.push([I.map,'Dependência regional',
    `${topReg[0]} responde por ${depReg}% do VGV da carteira, presente em ${nUf} estado(s) de ${nReg} região(ões).`]);
  ins.push([I.trend,'Distribuição econômica',
    `Cada ativo vale em média ${fmtBRLk(vgvAtivo)} e cada unidade ${fmtBRLk(vgvUnid)} de VGV.`]);
  if(booked) ins.push([I.report,'VGV x Booked Value',
    `A carteira administra ${fmtBRLk(ag.vgvTotal)} em VGV com ${fmtBRLk(booked)} de Booked Value contratado — o Booked é métrica de contrato e não possui recorte territorial.`]);

  return `<div class="section-bar" style="margin-top:20px"><h2>Inteligência Territorial</h2><div class="line"></div>
    <span class="desc">leitura de negócio da carteira no território</span></div>
  <div class="kpi-strip kpi-strip-4">
    ${kpi('k-blue','Concentração do Líder',concUf+'%','',`${UF_NOME[topUf[0]]||topUf[0]} · ${txtConc}`)}
    ${kpi('k-'+(depReg>=60?'amber':'teal'),'Dependência Regional',depReg+'%','',`${topReg?topReg[0]:'—'} lidera o VGV`)}
    ${kpi('k-green','VGV por Ativo',money(vgvAtivo),'','média da carteira')}
    ${kpi('k-purple','Cobertura Territorial',nUf,'',`de ${UFS.length} estados · ${cobertura}% do país`)}
  </div>
  <div class="cfg-grid" style="margin-top:16px">
    ${biRank('Ranking de Estados por VGV',ag.vgvPorEstado,fmtBRLk,uf=>UF_NOME[uf]||uf)}
    ${biRank('Ranking de Estados por Ativos',ag.porEstado,null,uf=>UF_NOME[uf]||uf)}
  </div>
  <div class="card" style="margin-top:16px"><div class="card-head"><div class="ico">${svg(I.map)}</div>
      <h3>Correlação Regional</h3><span class="desc">clientes · ativos · unidades · VGV</span>
      <div class="spacer"></div><span class="pill">${linhas.length} região(ões)</span></div>
    <div class="tbl-wrap"><table class="data"><thead><tr>
      <th>Região</th><th class="num">Clientes</th><th class="num">Ativos</th><th class="num">Unidades</th><th class="num">VGV</th><th class="num">Participação</th></tr></thead>
      <tbody>${linhas.length? linhas.map(l=>`<tr>
        <td><b>${esc(l.r)}</b></td><td class="num">${l.cli}</td><td class="num">${l.at}</td>
        <td class="num">${num(l.un)}</td><td class="num">${money(l.vgv)}</td>
        <td class="num"><span class="part-bar" title="${pct(l.vgv,vgvTot)}% do VGV total"><i style="width:${pct(l.vgv,vgvTot)}%"></i></span><b>${pct(l.vgv,vgvTot)}%</b></td>
      </tr>`).join('') : emptyRow(6,'Sem dados regionais.')}</tbody></table></div></div>
  <div class="card" style="margin-top:16px"><div class="card-head"><div class="ico">${svg(I.bolt)}</div><h3>Leituras do Território</h3>
      <div class="spacer"></div><span class="badge b-${tomConc}"><span class="d"></span>${esc(txtConc)}</span></div>
    <div class="card-body">${ins.map(([ic,t,d])=>`<div class="bi-insight"><span class="ic">${svg(ic)}</span>
      <span><b>${esc(t)}</b><span>${esc(d)}</span></span></div>`).join('')}</div></div>`;
}

  async impArquivo(inp){

      const b=window.__IMP.construir(a,ctx);

      if(box) box.innerHTML=impPreviaHTML(a,b);
      const cf=el('impConfirmar');
      if(cf) cf.innerHTML=`<button class="btn primary" onclick="App.confirmarImportacao()">${svg(I.check)} Confirmar Substituição da Base</button>`;

    }catch(e){
      if(box) box.innerHTML=`<div class="imp-erro">${svg(I.alert)}<span><b>Não foi possível ler o arquivo.</b>${esc(e.message||String(e))}</span></div>`;

  confirmarImportacao(){
    if(!_impBase||!_impAnalise){ toast('Nenhuma importação analisada.'); return; }
    if(!confirm('Esta ação substituirá a base operacional atual (clientes, operações, propostas e ativos).\n\nUm backup será criado automaticamente. Usuários, permissões e configurações serão preservados.\n\nDeseja continuar?')) return;
    const d=DB(); const np=nowParts(); const quem=(getSession()&&getSession().nome)||'';
    // 1) BACKUP ATÔMICO da base anterior
    const snapshot={ gerado:np.iso, usuario:quem, arquivo:_impArquivo,
      clientes:d.clientes, propostas:d.propostas, surveys:d.surveys, activation:d.activation, ttfv:d.ttfv };
    try{ dl('backup-base-'+np.iso.slice(0,10)+'.json', JSON.stringify(snapshot,null,1), 'application/json'); }catch(_){}
    d.backupImportacao=snapshot;
    // 2) SUBSTITUIÇÃO — apenas a base operacional
    d.clientes=_impBase.clientes;
    d.propostas=_impBase.propostas;
    d.surveys={}; d.activation={}; d.ttfv={};
    // usuários, senhas, perfis, permissões, config, histórico: intocados
    const st=_impAnalise.stats;
    addHistory({modulo:'Cadastro',cliente:'—',campo:'Importação de Base Excel',
      de:'base anterior ('+(snapshot.clientes||[]).length+' clientes)',
      para:`${_impArquivo} · ${st.linhas} linhas · ${_impBase.clientes.length} clientes · ${_impBase.propostas.length} operações · ${_impBase.clientes.reduce((s,c)=>s+(c.ativos||[]).length,0)} ativos · ${_impAnalise.alertas.length} alerta(s)`});
    save(d);
    try{ migrate(); }catch(_){}
    filters.cliente=''; this.closeModal(); buildFilters(); this.refresh();
    toast('Base substituída · '+_impBase.clientes.length+' clientes importados');
  },

    if(d.length<=8) return d.slice(0,2)+'.'+d.slice(2,5)+'.'+d.slice(5);
    if(d.length<=12) return d.slice(0,2)+'.'+d.slice(2,5)+'.'+d.slice(5,8)+'/'+d.slice(8);

  async criarSenha(){ const email=(el('loginEmail').value||'').trim().toLowerCase();
    const p1=el('loginPass').value||'', p2=el('loginPass2').value||'';
    if(!email || email.indexOf('@')<1){ authErr('Informe um e-mail válido.'); return; }

    const meta=known?{nome:known.nome,perfil:known.perfil,cargo:known.cargo}:guestFromEmail(email);
    const {data,error}=await supa.auth.signUp({email,password:p1,options:{data:meta}});
    if(error){ authErr(/already registered|já está cadastrado/i.test(error.message)?'Este e-mail já tem senha. Use “Esqueci minha senha”.':/domain_not_allowed|trinusco/i.test(error.message)?'Cadastro disponível apenas para e-mails corporativos @trinusco.com.br.':error.message); return; }
    if(!data.session){ _authMode='login'; renderAuth(); toast('Conta criada! Verifique seu e-mail para confirmar o acesso.'); return; }
    logSeg(meta.nome,'Criação de senha',novo?'Novo acesso Área Parceira':'Primeiro acesso');
    entrarComUsuario({...meta,ativo:true},{msg:(novo?'Acesso de parceiro criado (somente leitura).':'Senha criada. Bem-vinda(o), '+meta.nome.split(' ')[0]+'!')}); },
  async redefinirSenha(){ const email=(el('loginEmail').value||'').trim().toLowerCase();
    if(!email || email.indexOf('@')<1){ authErr('Informe um e-mail válido.'); return; }
    const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
    if(error){ authErr(error.message); return; }
    logSeg(email,'Solicitação de redefinição de senha','Link enviado por e-mail');
    _authMode='login'; renderAuth(); toast('Se esse e-mail estiver cadastrado, enviamos um link de redefinição.'); },
  async trocarSenhaObrigatoria(){
    const p1=el('loginPass').value||'', p2=el('loginPass2').value||'';
    if(p1.length<6){ authErr('A senha deve ter ao menos 6 caracteres.'); return; }

    const perfil=await carregarPerfil(data.user);

    entrarComUsuario(perfil,{msg:'Senha atualizada. Bem-vinda(o), '+perfil.nome.split(' ')[0]+'!'}); },
  async logout(){ const u=getSession(); if(u) logSeg(u.nome,'Logout',''); await supa.auth.signOut(); clearSession(); showLogin(); },

  /* ---- gestão de credenciais (Gestão Executiva) ---- */
  async resetarSenhaUsuario(i){ if(!can('users')){ toast('Ação não permitida.'); return; }
    const d=DB(); const u=d.users[i]; if(!u) return;
    if(!confirm('Enviar link de redefinição de senha para '+u.nome+' ('+u.email+')?')) return;
    const {error}=await supa.auth.resetPasswordForEmail(u.email,{redirectTo:window.location.origin+window.location.pathname});
    if(error){ toast('Erro ao enviar: '+error.message); return; }
    logSeg(u.nome,'Solicitação de redefinição de senha','Enviado pela Gestão Executiva ('+(getSession().nome)+')');
    toast('Link de redefinição enviado para '+u.email); },
  async toggleAtivo(i){ if(!can('users')){ toast('Ação não permitida.'); return; }
    const d=DB(); const u=d.users[i]; if(!u) return;
    const me=getSession(); if(me&&me.email===u.email){ alert('Você não pode desativar o próprio usuário em uso.'); return; }
    u.ativo=(u.ativo===false); save(d); logSeg(u.nome,u.ativo?'Usuário reativado':'Usuário desativado','por '+(me?me.nome:'—'));
    this.refresh(); toast(u.ativo?'Usuário reativado':'Usuário desativado');

/* =========================================================================
   V5 · CAMADA DE APRESENTAÇÃO — Tooltip padronizado
   Não altera regra de negócio: apenas substitui o tooltip nativo do
   navegador (atributo title) por um componente visual consistente.
   ========================================================================= */
(function(){
  try{
    if(typeof document==='undefined') return;
    var tip=null, host=null;
    function ensure(){
      if(!tip){ tip=document.createElement('div'); tip.className='oo-tip'; document.body.appendChild(tip); }
      return tip;
    }
    function place(e){
      if(!tip) return;
      var pad=12, r=tip.getBoundingClientRect();
      var x=e.clientX+pad, y=e.clientY+pad;
      if(x+r.width>window.innerWidth-8) x=e.clientX-r.width-pad;
      if(y+r.height>window.innerHeight-8) y=e.clientY-r.height-pad;
      tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px';
    }
    document.addEventListener('mouseover',function(e){
      var t=e.target&&e.target.closest? e.target.closest('[title]') : null;
      if(!t||t===host) return;
      var txt=t.getAttribute('title'); if(!txt) return;
      host=t; t.setAttribute('data-oo-tip',txt); t.removeAttribute('title');
      var el=ensure(); el.textContent=txt; place(e);
      requestAnimationFrame(function(){ el.classList.add('on'); });
    },true);
    document.addEventListener('mousemove',function(e){ if(host&&tip&&tip.classList.contains('on')) place(e); },true);
    document.addEventListener('mouseout',function(e){
      if(!host) return;
      if(e.relatedTarget&&host.contains(e.relatedTarget)) return;
      var saved=host.getAttribute('data-oo-tip');
      if(saved!=null){ host.setAttribute('title',saved); host.removeAttribute('data-oo-tip'); }
      host=null; if(tip) tip.classList.remove('on');
    },true);
    window.addEventListener('blur',function(){
      if(host){ var s=host.getAttribute('data-oo-tip'); if(s!=null){ host.setAttribute('title',s); host.removeAttribute('data-oo-tip'); } host=null; }
      if(tip) tip.classList.remove('on');
    });
  }catch(_){ /* tooltip é enfeite: nunca deve quebrar a aplicação */ }
})();


/* =========================================================================
   V7 · PALETA DE COMANDOS (Ctrl/⌘ + K)
   Navegação contínua: ir a qualquer módulo ou cliente sem procurar no menu.
   Lê a navegação já renderizada — logo, respeita as permissões do perfil
   automaticamente. Camada de navegação: não altera regra de negócio.
   ========================================================================= */
(function(){
  try{
    if(typeof document==='undefined') return;
    var box=null, input=null, list=null, items=[], sel=0, open=false;

    function build(){
      box=document.createElement('div'); box.className='cmdk'; box.id='cmdk';
      box.innerHTML='<div class="cmdk-panel" role="dialog" aria-label="Busca rápida">'+
        '<div class="cmdk-top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+
        '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
        '<input id="cmdkInput" placeholder="Buscar módulo ou cliente…" autocomplete="off" spellcheck="false">'+
        '<kbd>esc</kbd></div><div class="cmdk-list" id="cmdkList"></div>'+
        '<div class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>enter</kbd> abrir</span></div></div>';
      document.body.appendChild(box);
      input=box.querySelector('#cmdkInput'); list=box.querySelector('#cmdkList');
      box.addEventListener('mousedown',function(e){ if(e.target===box) close(); });
      input.addEventListener('input',function(){ render(input.value); });
      input.addEventListener('keydown',function(e){
        if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,items.length-1); paint(); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); paint(); }
        else if(e.key==='Enter'){ e.preventDefault(); run(sel); }
        else if(e.key==='Escape'){ e.preventDefault(); close(); }
      });
    }

    function sources(){
      var out=[];
      // módulos: lê o menu renderizado → permissões respeitadas por construção
      try{
        document.querySelectorAll('#nav [data-go]').forEach(function(b){
          out.push({tipo:'Módulo', id:b.dataset.go, nome:(b.textContent||'').trim().replace(/\s+/g,' '), acao:'go'});
        });
      }catch(_){}
      // clientes: só quando a Jornada estiver acessível ao perfil
      try{
        var temJornada=out.some(function(o){ return o.id==='jornada'; });
        if(temJornada && window.__OO && window.__OO.DB){
          (window.__OO.DB().clientes||[]).forEach(function(c){
            out.push({tipo:'Cliente', id:c.id, nome:c.nome, sub:(c.cidade?c.cidade+' · ':'')+(c.estado||''), acao:'cliente'});
          });
        }
      }catch(_){}
      return out;
    }

    function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

    function render(q){
      var all=sources(), t=norm(q);
      items = t? all.filter(function(o){ return norm(o.nome).indexOf(t)>=0 || norm(o.tipo).indexOf(t)>=0; }) : all;
      items = items.slice(0,40); sel=0; paint();
    }

    function paint(){
      if(!list) return;
      if(!items.length){ list.innerHTML='<div class="cmdk-empty">Nada encontrado.</div>'; return; }
      var html='', grupo='';
      items.forEach(function(o,i){
        if(o.tipo!==grupo){ grupo=o.tipo; html+='<div class="cmdk-grp">'+grupo+'</div>'; }
        html+='<div class="cmdk-item'+(i===sel?' on':'')+'" data-i="'+i+'">'+
          '<span class="cmdk-nm">'+esc(o.nome)+'</span>'+
          (o.sub?'<span class="cmdk-sub">'+esc(o.sub)+'</span>':'')+'</div>';
      });
      list.innerHTML=html;
      list.querySelectorAll('.cmdk-item').forEach(function(el){
        el.addEventListener('mouseenter',function(){ sel=+el.dataset.i; paint(); });
        el.addEventListener('click',function(){ run(+el.dataset.i); });
      });
      var on=list.querySelector('.cmdk-item.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest'});
    }

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    function run(i){
      var o=items[i]; if(!o||!window.App) return; close();
      try{ if(o.acao==='cliente') window.App.abrirCliente(o.id); else window.App.go(o.id); }catch(_){}
    }

    function show(){
      if(!box) build();
      // só abre se a aplicação estiver autenticada e visível
      var gate=document.getElementById('authGate');
      var travado = gate && gate.innerHTML && gate.innerHTML.trim().length>0 &&
                    gate.style.display!=='none' &&
                    (typeof getComputedStyle!=='function' || getComputedStyle(gate).display!=='none');
      if(travado) return;
      open=true; box.classList.add('on'); input.value=''; render('');
      setTimeout(function(){ try{ input.focus(); }catch(_){ } },10);
    }
    function close(){ open=false; if(box) box.classList.remove('on'); }

    document.addEventListener('keydown',function(e){
      var k=(e.key||'').toLowerCase();
      if((e.ctrlKey||e.metaKey) && k==='k'){ e.preventDefault(); open?close():show(); }
      else if(k==='escape' && open){ close(); }
    });

    window.__cmdk={show:show, close:close};
  }catch(_){ /* navegação auxiliar: nunca deve quebrar a aplicação */ }
})();


/* =========================================================================
   V9 · IMPORTADOR DE BASE EXCEL
   Lê .xlsx nativamente (ZIP + XML), interpreta, consolida e distribui os
   dados nos módulos existentes. Substituição atômica com backup prévio.
   Preserva: usuários, senhas, perfis, permissões, configurações e listas.
   ========================================================================= */
(function(){
  const IMP={};

  /* ---------- 1. LEITURA NATIVA DE .XLSX (ZIP sem biblioteca) ---------- */
  function inflateRaw(bytes){
    // usa DecompressionStream quando disponível (navegadores modernos)
    if(typeof DecompressionStream==='function'){
      const ds=new DecompressionStream('deflate-raw');
      const stream=new Blob([bytes]).stream().pipeThrough(ds);
      return new Response(stream).arrayBuffer().then(b=>new Uint8Array(b));
    }
    return Promise.reject(new Error('Este navegador não suporta a leitura direta de .xlsx. Use o Chrome, Edge ou Firefox atualizados.'));
  }
  async function unzip(buf){
    const u8=new Uint8Array(buf), dv=new DataView(buf), files={};
    // localiza o End of Central Directory
    let eocd=-1;
    for(let i=u8.length-22;i>=0 && i>u8.length-66000;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
    if(eocd<0) throw new Error('Arquivo .xlsx inválido ou corrompido.');
    const nEnt=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
    for(let i=0;i<nEnt;i++){
      if(dv.getUint32(off,true)!==0x02014b50) break;
      const method=dv.getUint16(off+10,true);
      const csize=dv.getUint32(off+20,true);
      const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), cmtLen=dv.getUint16(off+32,true);
      const lho=dv.getUint32(off+42,true);
      const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nameLen));
      // cabeçalho local para achar o início real dos dados
      const lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true);
      const dstart=lho+30+lNameLen+lExtraLen;
      const raw=u8.subarray(dstart,dstart+csize);
      files[name]= method===0 ? Promise.resolve(raw) : inflateRaw(raw);
      off+=46+nameLen+extraLen+cmtLen;
    }
    const out={};
    for(const k in files){ try{ out[k]=new TextDecoder().decode(await files[k]); }catch(_){ } }
    return out;
  }
  function colToIdx(ref){
    const m=/^([A-Z]+)/.exec(ref); if(!m) return 0;
    let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
    return n-1;
  }
  function parseSheet(xml,shared){
    const rows=[];
    const rowRe=/<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;
    const cellRe=/<c([^>]*)>([\s\S]*?)<\/c>|<c([^>]*)\/>/g;
    let rm;
    while((rm=rowRe.exec(xml))){
      const idx=+rm[1]-1, cells=[]; let cm;
      const inner=rm[2]; cellRe.lastIndex=0;
      while((cm=cellRe.exec(inner))){
        const attrs=cm[1]||cm[3]||'';
        const rref=/r="([A-Z]+\d+)"/.exec(attrs);
        const ci=rref?colToIdx(rref[1]):cells.length;
        const t=/t="([^"]+)"/.exec(attrs);
        const body=cm[2]||'';
        let v=null;
        if(t&&t[1]==='inlineStr'){ const im=/<t[^>]*>([\s\S]*?)<\/t>/.exec(body); v=im?unesc(im[1]):null; }
        else { const vm=/<v>([\s\S]*?)<\/v>/.exec(body); if(vm){ v=vm[1];
          if(t&&t[1]==='s') v=shared[+v]!==undefined?shared[+v]:'';
          else if(t&&t[1]==='e') v=null;                    // erro de fórmula (#VALUE!)
          else v=v===''?null:(isNaN(+v)?unesc(v):+v); } }
        cells[ci]= (typeof v==='string')? unesc(v) : v;
      }
      rows[idx]=cells;
    }
    return rows;
  }
  function unesc(s){ return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'); }
  function sharedStrings(xml){
    if(!xml) return [];
    const out=[]; const siRe=/<si>([\s\S]*?)<\/si>/g; let m;
    while((m=siRe.exec(xml))){
      let txt=''; const tRe=/<t[^>]*>([\s\S]*?)<\/t>/g; let tm;
      while((tm=tRe.exec(m[1]))) txt+=tm[1];
      out.push(unesc(txt));
    }
    return out;
  }
  IMP.lerArquivo=async function(file){
    const buf=await file.arrayBuffer();
    const files=await unzip(buf);
    const shared=sharedStrings(files['xl/sharedStrings.xml']);
    const sheetName=Object.keys(files).find(k=>/^xl\/worksheets\/sheet1\.xml$/.test(k))
                 || Object.keys(files).find(k=>/^xl\/worksheets\/.*\.xml$/.test(k));
    if(!sheetName) throw new Error('Nenhuma planilha encontrada no arquivo.');
    return parseSheet(files[sheetName],shared);
  };

  /* ---------- 2. NORMALIZADORES ---------- */
  const PLACEHOLDER=/^(n\/?a|nao informado|não informado|\(nao informado\)|\(não informado\)|nao se aplica|não se aplica|sem informacao|sem informação|indefinido|a definir|nd|--+)$/i;
  const VAZIO=v=>v===null||v===undefined||v===''||v==='-'||(typeof v==='string'&&(v.trim()===''||v.trim()==='-'||PLACEHOLDER.test(v.trim())||v.trim().startsWith('#')));
  const txt=v=>VAZIO(v)?'':String(v).trim();
  function numero(v){
    if(VAZIO(v)) return 0;
    if(typeof v==='number') return v;
    let s=String(v).replace(/[R$\s]/g,'');
    if(s.indexOf(',')>=0){ s=s.replace(/\./g,'').replace(',','.'); }
    const n=parseFloat(s); return isNaN(n)?0:n;
  }
  function dataISO(v){
    if(VAZIO(v)) return '';
    if(typeof v==='number'){                       // serial do Excel
      if(v<1||v>80000) return '';
      const ms=Date.UTC(1899,11,30)+Math.round(v)*86400000;
      return new Date(ms).toISOString().slice(0,10);
    }
    const s=String(v).trim();
    let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
    m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
    if(m) return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
    const d=new Date(s); return isNaN(d)?'':d.toISOString().slice(0,10);
  }
  const soDig=v=>String(v||'').replace(/\D/g,'');
  function cnpjFmt(v){ const d=soDig(v); return d.length===14? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5') : txt(v); }
  function cnpjValido(v){ const d=soDig(v); return d.length===14; }
  const chave=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();

  /* ---------- 3. MAPEAMENTO DE COLUNAS (por nome, tolerante) ---------- */
  const MAPA=[
    ['operacao',/^opera[çc][ãa]o/i],['etapa',/^etapa/i],['status',/^status$/i],['dominio',/^dom[íi]nio/i],
    ['cliente',/^cliente$/i],['razaoCliente',/raz[ãa]o social.*cliente/i],['cnpjCliente',/cnpj.*cliente/i],
    ['classificacao',/^classifica[çc][ãa]o/i],['elite',/^elite/i],
    ['ativo',/^ativo\b|holding/i],['razaoAtivo',/raz[ãa]o social.*ativo/i],['cnpjAtivo',/cnpj.*ativo/i],
    ['localizacao',/^localiza[çc][ãa]o/i],['uf',/^uf$/i],['tipologia',/^tipologia/i],
    ['unidades',/^unidades/i],['vgv',/^vgv/i],['gerente',/gerente de contas/i],
    ['dtSolicProposta',/solicita[çc][ãa]o da proposta/i],['dtEnvioProposta',/1.*envio da proposta/i],
    ['dtAtualProposta',/[úu]ltima atualiza[çc][ãa]o da proposta/i],['dtSolicMinuta',/solicita[çc][ãa]o d[oa] minuta/i],
    ['dtEnvioMinuta',/envio da minuta/i],['dtEnvioContrato',/envio do contrato/i],
    ['dtAssinatura',/assinatura do contrato/i],['dtAditivo',/aditivo|distrato/i],
    ['bookedValue',/^booked/i],['keyAccount',/^key account/i],['pontoFocal',/ponto focal/i],
    ['dtHandoff',/handoff/i],['dtKickoff',/kickoff/i],['dtGoLivePrev',/prevista go live/i],
    ['dtGoLiveReal',/real go live/i],['statusAtual',/status atual/i],['resumoServicos',/resumo servi[çc]os/i]
  ];
  function acharCabecalho(rows){
    for(let i=0;i<Math.min(rows.length,15);i++){
      const r=rows[i]||[];
      const textuais=r.filter(v=>typeof v==='string'&&v.trim().length>2).length;
      if(textuais>=10) return i;
    }
    return 0;
  }
  function mapear(hdr){
    const col={}, usados={};
    hdr.forEach((h,i)=>{
      if(typeof h!=='string') return;
      for(const [campo,re] of MAPA){
        if(col[campo]===undefined && re.test(h.trim())){ col[campo]=i; usados[i]=campo; return; }
      }
    });
    // colunas de serviço = cabeçalhos textuais após "Resumo Serviços" ainda não mapeados
    const inicio = col.resumoServicos!==undefined? col.resumoServicos+1 : hdr.length;
    const servCols=[];
    for(let i=inicio;i<hdr.length;i++){ if(typeof hdr[i]==='string'&&hdr[i].trim()&&usados[i]===undefined) servCols.push([i,hdr[i].trim()]); }
    return {col,servCols};
  }

  /* ---------- 4. CONSOLIDAÇÃO (cliente → operações → ativos) ---------- */
  const ETAPA_MAP={'contrato':'contrato','aditivo':'contrato','mandato':'contrato','proposta':'contrato','distrato':'contrato'};
  function statusProposta(etapa,status){
    const e=chave(etapa), st=chave(status);
    if(/perdid/.test(st)) return 'Proposta Perdida';
    if(/cancel/.test(st)) return 'Cancelada';
    if(/assinad/.test(st)) return 'Contrato Assinado';
    if(/aguardando assinatura/.test(st)) return 'Proposta Aprovada';
    if(/minuta/.test(st)) return 'Em Negociação';
    if(/elaborad/.test(st)) return 'Proposta Elaborada';
    if(/solicitad/.test(st)) return 'Proposta Elaborada';
    if(/pausad/.test(st)) return 'Em Negociação';
    if(/contrato|aditivo/.test(e)) return 'Contrato Assinado';
    return 'Proposta Elaborada';
  }
  function produtoCanonico(nome,catalogo){
    const k=chave(nome);
    for(const p of catalogo){ if(chave(p)===k) return p; }
    for(const p of catalogo){ const kp=chave(p); if(kp&&(k.indexOf(kp)>=0||kp.indexOf(k)>=0)) return p; }
    return nome;
  }

  IMP.analisar=function(rows,ctx){
    const hi=acharCabecalho(rows);
    const hdr=rows[hi]||[];
    const {col,servCols}=mapear(hdr);
    const dados=rows.slice(hi+1).filter(r=>r&&r.some((v,i)=>i<35&&!VAZIO(v)));
    const g=(r,c)=>col[c]===undefined?null:r[col[c]];

    // ---- passagem 1: índice nome/razão → CNPJ conhecido ----
    // O mesmo cliente aparece em linhas com e sem CNPJ; sem este índice,
    // cada variação viraria um cliente distinto.
    const idxCnpj={};
    dados.forEach(r=>{
      const cn=txt(g(r,'cnpjCliente'));
      if(!cnpjValido(cn)) return;
      const d=soDig(cn);
      [txt(g(r,'cliente')),txt(g(r,'razaoCliente'))].forEach(n=>{ if(n) idxCnpj[chave(n)]=d; });
    });
    const idxCnpjAtivo={};
    dados.forEach(r=>{
      const cn=txt(g(r,'cnpjAtivo'));
      if(!cnpjValido(cn)) return;
      const d=soDig(cn);
      [txt(g(r,'ativo')),txt(g(r,'razaoAtivo'))].forEach(n=>{ if(n) idxCnpjAtivo[chave(n)]=d; });
    });

    const clientes=new Map();   // chave → cliente consolidado
    const alertas=[];
    let nOps=0,nAtivos=0,linhasComAlerta=0;

    dados.forEach((r,idx)=>{
      const linha=hi+2+idx;
      const nomeCli=txt(g(r,'cliente')), razaoCli=txt(g(r,'razaoCliente')), cnpjCli=txt(g(r,'cnpjCliente'));
      if(!nomeCli && !razaoCli && !cnpjCli){
        alertas.push({nivel:'Crítico',linha,msg:'Linha sem cliente identificável — será ignorada.'}); linhasComAlerta++; return;
      }
      // chave: CNPJ (próprio ou herdado do índice) → Razão Social → Nome
      const dig = cnpjValido(cnpjCli)? soDig(cnpjCli) : (idxCnpj[chave(nomeCli)]||idxCnpj[chave(razaoCli)]||'');
      const kCli = dig? 'c:'+dig : (razaoCli? 'r:'+chave(razaoCli) : 'n:'+chave(nomeCli));
      if(!clientes.has(kCli)){
        clientes.set(kCli,{nome:nomeCli||razaoCli||cnpjFmt(cnpjCli), razaoSocial:razaoCli, cnpj:cnpjCli?cnpjFmt(cnpjCli):'',
          classificacao:txt(g(r,'classificacao')), elite:/^s|^1|^sim/i.test(txt(g(r,'elite')))?'Sim':(txt(g(r,'elite'))?'Não':''),
          dominio:txt(g(r,'dominio')), operacoes:new Map(), ativos:new Map(), produtos:new Set(),
          keyAccount:'', respOnboarding:'', respComercial:'', uf:'', cidade:''});
      }
      const C=clientes.get(kCli);
      if(!C.razaoSocial&&razaoCli) C.razaoSocial=razaoCli;
      if(!C.cnpj&&cnpjValido(cnpjCli)) C.cnpj=cnpjFmt(cnpjCli);
      if(!C.classificacao) C.classificacao=txt(g(r,'classificacao'));
      if(!C.keyAccount) C.keyAccount=txt(g(r,'keyAccount'));
      if(!C.respOnboarding) C.respOnboarding=txt(g(r,'pontoFocal'));
      if(!C.respComercial) C.respComercial=txt(g(r,'gerente'));
      if(!cnpjValido(cnpjCli)&&cnpjCli){ alertas.push({nivel:'Atenção',linha,msg:`CNPJ de cliente inválido: ${cnpjCli}`}); linhasComAlerta++; }
      if(!C.classificacao) alertas.push({nivel:'Informativo',linha,msg:`Cliente "${C.nome}" sem classificação.`});

      // ---- operação (1 registro, várias linhas possíveis) ----
      const numOp=txt(g(r,'operacao'));
      const kOp = numOp? 'o:'+numOp : 'x:'+chave(txt(g(r,'etapa'))+'|'+txt(g(r,'status'))+'|'+dataISO(g(r,'dtSolicProposta')));
      if(!C.operacoes.has(kOp)){
        nOps++;
        const servicos=new Set();
        const resumo=txt(g(r,'resumoServicos'));
        if(resumo) resumo.split(/[,;\/\n]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>servicos.add(x));
        servCols.forEach(([ci,nm])=>{ const v=r[ci]; if(!VAZIO(v)&&String(v).trim()!=='0') servicos.add(nm); });
        C.operacoes.set(kOp,{numero:numOp, etapa:txt(g(r,'etapa')), status:txt(g(r,'status')), resumoServicos:resumo,
          dominio:txt(g(r,'dominio')), statusAtual:txt(g(r,'statusAtual')),
          bookedValue:numero(g(r,'bookedValue')), responsavel:txt(g(r,'gerente')),
          dtSolicProposta:dataISO(g(r,'dtSolicProposta')), dtEnvioProposta:dataISO(g(r,'dtEnvioProposta')),
          dtAtualProposta:dataISO(g(r,'dtAtualProposta')), dtSolicMinuta:dataISO(g(r,'dtSolicMinuta')),
          dtEnvioMinuta:dataISO(g(r,'dtEnvioMinuta')), dtEnvioContrato:dataISO(g(r,'dtEnvioContrato')),
          dtAssinatura:dataISO(g(r,'dtAssinatura')), dtAditivo:dataISO(g(r,'dtAditivo')),
          dtHandoff:dataISO(g(r,'dtHandoff')), dtKickoff:dataISO(g(r,'dtKickoff')),
          dtGoLivePrev:dataISO(g(r,'dtGoLivePrev')), dtGoLiveReal:dataISO(g(r,'dtGoLiveReal')),
          servicos:servicos});
      }
      const O=C.operacoes.get(kOp);
      // a mesma operação aparece em várias linhas (uma por ativo): completa o que faltar
      if(!O.bookedValue) O.bookedValue=numero(g(r,'bookedValue'));
      if(!O.statusAtual) O.statusAtual=txt(g(r,'statusAtual'));
      if(!O.responsavel) O.responsavel=txt(g(r,'gerente'));
      if(!O.dominio) O.dominio=txt(g(r,'dominio'));
      if(!O.resumoServicos) O.resumoServicos=txt(g(r,'resumoServicos'));
      ['dtSolicProposta','dtEnvioProposta','dtAtualProposta','dtSolicMinuta','dtEnvioMinuta',
       'dtEnvioContrato','dtAssinatura','dtAditivo','dtHandoff','dtKickoff','dtGoLivePrev','dtGoLiveReal']
        .forEach(f=>{ if(!O[f]) O[f]=dataISO(g(r,f)); });
      // serviços marcados em qualquer linha da operação
      const resumo2=txt(g(r,'resumoServicos'));
      if(resumo2) resumo2.split(/[,;\/\n]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>O.servicos.add(x));
      servCols.forEach(([ci,nm])=>{ const v=r[ci]; if(!VAZIO(v)&&String(v).trim()!=='0') O.servicos.add(nm); });
      O.servicos.forEach(sv=>C.produtos.add(sv));

      // ---- ativo (consolidado por CNPJ → razão → nome) ----
      const nomeAt=txt(g(r,'ativo')), razaoAt=txt(g(r,'razaoAtivo')), cnpjAt=txt(g(r,'cnpjAtivo'));
      if(nomeAt||razaoAt||cnpjAt){
        const digAt = cnpjValido(cnpjAt)? soDig(cnpjAt) : (idxCnpjAtivo[chave(nomeAt)]||idxCnpjAtivo[chave(razaoAt)]||'');
        let kAt = digAt? 'c:'+digAt : (razaoAt? 'r:'+chave(razaoAt) : 'n:'+chave(nomeAt));
        // A planilha às vezes repete o mesmo CNPJ/razão em empreendimentos distintos.
        // Fundir por CNPJ apagaria um ativo real: se o nome difere, mantém separado.
        const jaExiste=C.ativos.get(kAt);
        if(jaExiste && nomeAt && chave(jaExiste.nome)!==chave(nomeAt)){
          alertas.push({nivel:'Atenção',linha,msg:`Ativos "${jaExiste.nome}" e "${nomeAt}" compartilham o mesmo CNPJ/razão social — mantidos como ativos separados.`});
          kAt = kAt+'|'+chave(nomeAt);
        }
        if(!C.ativos.has(kAt)){
          nAtivos++;
          const uf=txt(g(r,'uf')).toUpperCase().slice(0,2);
          const loc=txt(g(r,'localizacao'));
          if(!cnpjAt) alertas.push({nivel:'Atenção',linha,msg:`Ativo "${nomeAt||razaoAt}" sem CNPJ.`});
          C.ativos.set(kAt,{nome:nomeAt||razaoAt||cnpjFmt(cnpjAt), razaoSocial:razaoAt, cnpj:cnpjAt?cnpjFmt(cnpjAt):'',
            estado:uf, cidade:loc&&loc!==uf?loc:'', localizacao:loc, tipologia:txt(g(r,'tipologia')),
            unidades:Math.round(numero(g(r,'unidades'))), vgv:numero(g(r,'vgv')),
            operacao:numOp});
          if(!uf) alertas.push({nivel:'Informativo',linha,msg:`Ativo "${nomeAt||razaoAt}" sem UF — ficará fora do mapa.`});
          else if(!C.uf) C.uf=uf;
        } else {
          // consolida dados faltantes do ativo repetido — a primeira linha não pode
          // ser a única fonte: campos vazios são completados pelas linhas seguintes
          const A=C.ativos.get(kAt);
          if(!A.vgv) A.vgv=numero(g(r,'vgv'));
          if(!A.unidades) A.unidades=Math.round(numero(g(r,'unidades')));
          if(!A.estado) A.estado=txt(g(r,'uf')).toUpperCase().slice(0,2);
          if(!A.razaoSocial) A.razaoSocial=txt(g(r,'razaoAtivo'));
          if(!A.cnpj&&cnpjValido(txt(g(r,'cnpjAtivo')))) A.cnpj=cnpjFmt(txt(g(r,'cnpjAtivo')));
          if(!A.tipologia) A.tipologia=txt(g(r,'tipologia'));
          const loc2=txt(g(r,'localizacao'));
          if(!A.localizacao&&loc2) A.localizacao=loc2;
          if(!A.cidade&&loc2&&loc2!==A.estado) A.cidade=loc2;
          if(!A.operacao&&numOp) A.operacao=numOp;
        }
      }
    });

    return {clientes,alertas,stats:{linhas:dados.length,clientes:clientes.size,operacoes:nOps,ativos:nAtivos,linhasComAlerta},
            colunas:col,servCols,cabecalho:hi};
  };

  /* ---------- 5. CONSTRUÇÃO DA BASE OPERACIONAL ---------- */
  IMP.construir=function(analise,ctx){
    const {clientes}=analise;
    const O=ctx, hoje=O.hoje(), quem=ctx.usuario||'';
    const outCli=[], outProp=[];
    let seq=0;
    clientes.forEach((C)=>{
      const cid='ci'+(++seq).toString(36)+Date.now().toString(36).slice(-4);
      const ops=[...C.operacoes.values()];
      // datas da jornada = da operação mais avançada
      const assin=ops.map(o=>o.dtAssinatura).filter(Boolean).sort();
      const kick=ops.map(o=>o.dtKickoff||o.dtHandoff).filter(Boolean).sort();
      const golivePrev=ops.map(o=>o.dtGoLivePrev).filter(Boolean).sort();
      const goliveReal=ops.map(o=>o.dtGoLiveReal).filter(Boolean).sort();
      const statusAtual=(ops.find(o=>o.statusAtual)||{}).statusAtual||'';
      const bookedTotal=ops.reduce((s,o)=>s+(+o.bookedValue||0),0);

      // etapa da jornada derivada dos fatos (sem inventar)
      let etapa='contrato';
      if(goliveReal.length) etapa='operacao';
      else if(kick.length) etapa='onboarding';
      let status='Em andamento';
      if(ops.every(o=>/perdid|cancel|distrato/i.test(o.status+' '+o.etapa))) status='Cancelado';
      else if(goliveReal.length) status='Concluído';

      const produtos=[...C.produtos].map(p=>produtoCanonico(p,O.PRODUTOS));
      const ativos=[...C.ativos.values()].map((A,i)=>({
        id:cid+'_a'+i, nome:A.nome, razaoSocial:A.razaoSocial||'', cnpj:A.cnpj||'',
        estado:A.estado||'', cidade:A.cidade||'', localizacao:A.localizacao||'',
        regiao:A.estado?O.regiaoDoEstado(A.estado):'',
        tipologia:O.TIPOLOGIAS.includes(A.tipologia)?A.tipologia:'Outros',
        tipologiaOriginal:A.tipologia||'',
        quantidade:1, unidades:A.unidades||0, vgv:A.vgv||0, statusAtivo:'',
        operacao:A.operacao||'', criadoEm:assin[0]||hoje, criadoPor:quem,
        obs:(A.tipologia&&!O.TIPOLOGIAS.includes(A.tipologia))?('Tipologia na planilha: '+A.tipologia):''
      }));

      outCli.push({id:cid, nome:C.nome, razaoSocial:C.razaoSocial, cnpj:C.cnpj,
        classificacao:C.classificacao, elite:C.elite, dominio:C.dominio,
        produtos:produtos, tipologia:(ativos[0]&&ativos[0].tipologia)||'Incorporação',
        dataAssinatura:assin[0]||'', dataKickoff:kick[0]||'',
        goLivePrevisto:golivePrev[0]||'', goLiveReal:goliveReal[0]||'',
        respOnboarding:C.respOnboarding, keyAccount:C.keyAccount, respComercial:C.respComercial, respKickoff:C.respOnboarding,
        status:status, etapa:etapa, statusAtual:statusAtual, bookedValue:bookedTotal,
        obs:'', estado:C.uf||(ativos[0]&&ativos[0].estado)||'', cidade:(ativos[0]&&ativos[0].cidade)||'',
        criadoEm:assin[0]||ops.map(o=>o.dtSolicProposta).filter(Boolean).sort()[0]||hoje,
        criadoPor:quem, ativos:ativos,
        operacoes:ops.map(o=>({numero:o.numero,etapa:o.etapa,status:o.status,dominio:o.dominio,resumoServicos:o.resumoServicos||'',
          statusAtual:o.statusAtual,bookedValue:o.bookedValue,
          dtSolicProposta:o.dtSolicProposta,dtEnvioProposta:o.dtEnvioProposta,dtAtualProposta:o.dtAtualProposta,
          dtSolicMinuta:o.dtSolicMinuta,dtEnvioMinuta:o.dtEnvioMinuta,dtEnvioContrato:o.dtEnvioContrato,
          dtAssinatura:o.dtAssinatura,dtAditivo:o.dtAditivo,dtHandoff:o.dtHandoff,dtKickoff:o.dtKickoff,
          dtGoLivePrev:o.dtGoLivePrev,dtGoLiveReal:o.dtGoLiveReal,
          servicos:[...o.servicos].map(p=>produtoCanonico(p,O.PRODUTOS))}))
      });

      // cada operação vira UMA proposta no pipeline (registro único com datas por etapa)
      ops.forEach((o,i)=>{
        outProp.push({id:cid+'_p'+i, cliente:C.nome, clienteId:cid,
          status:statusProposta(o.etapa,o.status),
          valor:o.bookedValue||0, bookedValue:o.bookedValue||0,
          produtos:[...o.servicos].map(p=>produtoCanonico(p,O.PRODUTOS)),
          produto:([...o.servicos][0]||''), responsavel:o.responsavel||C.respComercial||'',
          numeroOperacao:o.numero, dominio:o.dominio, etapaContrato:o.etapa,
          dataElaboracao:o.dtSolicProposta||o.dtEnvioProposta||'',
          dataPrevista:o.dtGoLivePrev||'',
          dataAprovacao:o.dtEnvioContrato||o.dtEnvioMinuta||'',
          dataAssinatura:o.dtAssinatura||'',
          dataPerdida:/perdid|cancel|distrato/i.test(o.status+' '+o.etapa)?(o.dtAtualProposta||o.dtSolicProposta||''):'',
          dtSolicMinuta:o.dtSolicMinuta, dtEnvioMinuta:o.dtEnvioMinuta, dtEnvioContrato:o.dtEnvioContrato,
          dtAditivo:o.dtAditivo, dtHandoff:o.dtHandoff, dtKickoff:o.dtKickoff,
          dtGoLivePrev:o.dtGoLivePrev, dtGoLiveReal:o.dtGoLiveReal,
          dtSolicProposta:o.dtSolicProposta, dtEnvioProposta:o.dtEnvioProposta, dtAtualProposta:o.dtAtualProposta,
          statusAtual:o.statusAtual||'', resumoServicos:o.resumoServicos||'',
          obs:''});
      });
    });
    return {clientes:outCli, propostas:outProp};
  };

  window.__IMP=IMP;
})();
</script>
